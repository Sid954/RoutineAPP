name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Capacitor 8 CLI requires Node >= 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      # Capacitor 8 compiles with Java 21 (android/app/capacitor.build.gradle); JDK 17 cannot build it.
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      # Firebase config for FCM push. Without it the build still succeeds, but push is disabled
      # (the app detects this at runtime and skips registration instead of crashing).
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json restored."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — this APK will have no push notifications."
          fi

      # Every published APK must be signed with the SAME key, or Android refuses to install it as
      # an update. The runner's auto-generated debug key changes every run, so it is never published.
      - name: Restore release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — building a debug APK as a workflow artifact only; no GitHub release will be published."
          fi

      - name: Build Signed Release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
          mkdir -p ../release-output
          cp app/build/outputs/apk/release/app-release.apk ../release-output/app-release.apk

      - name: Build Debug APK (no keystore configured)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          mkdir -p ../release-output
          cp app/build/outputs/apk/debug/app-debug.apk ../release-output/app-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: routine-apk
          path: release-output/*.apk

      # Tag/name come from version.json (single source of truth) instead of a hardcoded version.
      - name: Read version
        id: version
        run: echo "name=$(node -p "require('./version.json').versionName")" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        if: steps.keystore.outputs.signed == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: "My Routine v${{ steps.version.outputs.name }}"
          body_path: RELEASE_NOTES.md
          files: release-output/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
